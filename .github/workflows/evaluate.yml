name: Evaluasi OPSD

# Dijalankan manual dari tab Actions. Mengunduh data Open Power System Data, mengunci SHA-256-nya,
# menjalankan seleksi validasi + uji sekali + prakiraan perencanaan. Dijalankan dari main:
# hasil dibuka sebagai pull request baru. Dijalankan dari cabang lain: hasil di-commit ke cabang
# itu (yang sudah punya PR). Tidak ada yang langsung masuk ke main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pasang
        run: pip install -e ".[dev]"
      - name: Tes unit dulu (berhenti bila gagal)
        run: pytest -q
      - name: Unduh data OPSD dan kunci SHA-256
        run: |
          if python -c "import json,sys; sys.exit(0 if 'opsd' in json.load(open('data/manifest.json')) else 1)" 2>/dev/null; then
            energy-forecast data --source opsd
          else
            energy-forecast data --source opsd --pin
          fi
      - name: Jalankan eksperimen (validasi, uji sekali, perencanaan)
        run: energy-forecast run --source opsd
      - name: Ekspor data website dan laporan
        run: |
          energy-forecast export-web
          python tools/write_report.py
      - name: Pemeriksaan independen
        run: python tools/verify_published.py
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-opsd
          path: |
            reports/
            web/public/data/
            docs/laporan-evaluasi.md
            data/manifest.json
          retention-days: 30
      - name: Simpan hasil (PR baru dari main, commit ke cabang lain)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: hasil/opsd-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="reports/results.json reports/test_forecasts.npz web/public/data docs/laporan-evaluasi.md data/manifest.json"
          if [ "${{ github.ref_name }}" = "main" ]; then
            git switch -c "$BRANCH"
            git add $files
            git commit -m "Hasil evaluasi OPSD (run ${{ github.run_id }})"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "Hasil evaluasi OPSD (run ${{ github.run_id }})" \
              --body "Dibuat otomatis oleh workflow Evaluasi OPSD, run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Tinjau docs/laporan-evaluasi.md sebelum merge." \
              || echo "::warning::PR tidak bisa dibuat otomatis; cabang $BRANCH sudah didorong, buka PR secara manual."
          else
            git add $files
            git commit -m "Hasil evaluasi OPSD (run ${{ github.run_id }})"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
