name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Pasang
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tes unit (kebocoran, metrik, cek silang sktime, paritas skenario)
        run: pytest --cov=energy_forecast --cov-report=term-missing
      - name: Pemeriksaan independen angka website
        if: hashFiles('reports/results.json') != ''
        run: python tools/verify_published.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tes TypeScript (skenario, ringkasan)
        run: npm test
      - name: Typecheck + build produksi
        run: npm run build
      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium
      - name: Tes e2e (CSP, responsif, aksesibilitas, paritas angka)
        if: hashFiles('web/public/data/meta.json') != ''
        run: SHOT_DIR=$RUNNER_TEMP/screenshots npm run e2e
      - name: Audit dependensi
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
          if-no-files-found: ignore
